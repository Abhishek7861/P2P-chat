server:
  port: 8080

spring:
  application:
    name: p2p
  web:
    error:
      include-message: always
      include-binding-errors: always
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/p2p}
    username: ${DB_USER:p2p}
    password: ${DB_PASSWORD:p2p}
  jpa:
    hibernate:
      ddl-auto: validate      # Flyway owns the schema, Hibernate only checks it
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-dev-only-secret-dev-only-secret-0000}
    ttl: PT12H